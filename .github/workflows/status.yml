name: status
on:
  schedule:
    - cron: "7 * * * *"      # hourly; the script applies the Central-time tiers
  workflow_dispatch:
  push:
    paths: [".github/workflows/status.yml", "scripts/fetch_status.py"]
permissions:
  contents: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch StatusGator pages and update data
        run: python3 scripts/fetch_status.py ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add status.json history.json
          git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin main && git push
