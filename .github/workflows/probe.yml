name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "scripts/sg_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sg_probe.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add debug; git commit -m "probe: StatusGator sample pages" || exit 0
          git pull --rebase origin main; git push
