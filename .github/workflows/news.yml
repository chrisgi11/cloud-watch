name: Refresh outage news

on:
  schedule:
    - cron: "*/10 * * * *"    # frequent tries; the script refreshes only when data is 50+ min old
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"
      - "scripts/fetch_news.py"
      - "ping.txt"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google News RSS and Google Alert feed
        env:
          ALERTS_FEED_URL: ${{ secrets.ALERTS_FEED_URL }}
        run: python3 scripts/fetch_news.py ${{ (github.event_name == 'schedule' || startsWith(github.event.head_commit.message, 'ping')) && '' || '--force' }}
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
