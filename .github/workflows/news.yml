name: Refresh outage news

on:
  schedule:
    - cron: "50 * * * *"      # hourly, ten minutes before the status refresh
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/news.yml"
      - "scripts/fetch_news.py"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Google News RSS
        run: python3 scripts/fetch_news.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain news.json)" ]; then
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
